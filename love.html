<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️ shosho ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #030005; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; padding: 20px; }
        
        /* خلفية النجوم المتحركة */
        .stars-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; background: radial-gradient(circle at center, #150523 0%, #030005 100%); }
        .star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle var(--duration) infinite ease-in-out; opacity: 0.3; }
        @keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }

        /* شاشة التحميل الأولى */
        .loading-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #030005; transition: opacity 0.8s ease; }
        .spinner { width: 60px; height: 60px; border: 4px solid rgba(255, 64, 129, 0.1); border-top: 4px solid #ff4081; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; box-shadow: 0 0 15px rgba(255,64,129,0.3); }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { color: #ff80ab; font-size: 1.2rem; text-shadow: 0 0 10px rgba(255,128,171,0.4); text-align: center; }

        /* شاشة الباسورد */
        .auth-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 30; display: none; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(10px); opacity: 0; transition: opacity 0.8s ease; }
        .auth-box { background: rgba(15, 5, 25, 0.75); border: 1px solid rgba(255, 105, 180, 0.2); padding: 35px 25px; border-radius: 30px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.9); }
        
        .auth-box h2 { color: #ff80ab; font-size: 1.3rem; margin-bottom: 8px; text-shadow: 0 0 10px rgba(255,128,171,0.4); }
        .auth-box p { color: #d0b3c6; font-size: 0.85rem; margin-bottom: 25px; }
        
        .code-dots { display: flex; justify-content: center; gap: 12px; margin-bottom: 25px; }
        .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #ff4081; background: transparent; transition: 0.3s; }
        .dot.active { background: #ff4081; box-shadow: 0 0 12px #ff4081; transform: scale(1.1); }

        .keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 15px; }
        .k-btn { background: rgba(255, 64, 129, 0.08); border: 1px solid rgba(255, 64, 129, 0.2); color: #fff; font-size: 1.1rem; font-weight: bold; height: 50px; border-radius: 50%; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; }
        .k-btn:hover { background: rgba(255, 64, 129, 0.3); transform: scale(1.08); border-color: #ff4081; }
        .auth-error { color: #ff6b6b; font-size: 0.8rem; margin-top: 10px; display: none; }

        /* شاشة العرض السينمائي (ظهر سطر بسطر) */
        .story-wrapper { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; justify-content: center; align-items: center; flex-direction: column; text-align: center; padding: 20px; }
        
        .cinematic-card { background: rgba(12, 4, 20, 0.88); border: 1px solid rgba(255, 105, 180, 0.25); padding: 40px 30px; border-radius: 35px; max-width: 750px; width: 95%; box-shadow: 0 30px 60px rgba(0,0,0,0.9); backdrop-filter: blur(15px); position: relative; min-height: 280px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        .line-container { font-size: 1.25rem; color: #fff; line-height: 2.3; text-shadow: 0 0 15px rgba(255,128,171,0.5); min-height: 120px; display: flex; align-items: center; justify-content: center; padding: 0 10px; direction: rtl; }

        /* النهاية: رسم القلب واسم Shrouk خط بخط */
        .drawing-reveal { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
        
        .heart-svg { width: 90px; height: 80px; overflow: visible; margin-bottom: 10px; }
        .heart-path { fill: none; stroke: #ff4081; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1000; stroke-dashoffset: 1000; filter: drop-shadow(0 0 10px #ff4081); }
        .heart-path.animate { animation: drawHeart 2.5s ease forwards; }
        @keyframes drawHeart { to { stroke-dashoffset: 0; fill: rgba(255, 64, 129, 0.25); } }

        .shrouk-svg { width: 260px; height: 75px; overflow: visible; }
        .shrouk-text-path { font-family: 'Great Vibes', cursive; font-size: 3.8rem; fill: none; stroke: #ff80ab; stroke-width: 2; stroke-dasharray: 800; stroke-dashoffset: 800; filter: drop-shadow(0 0 12px rgba(255,128,171,0.8)); }
        .shrouk-text-path.animate { animation: drawText 3s ease forwards 2s; }
        @keyframes drawText { to { stroke-dashoffset: 0; fill: #ff80ab; } }

        .final-msg { color: #f8bbd0; font-size: 1.05rem; opacity: 0; transition: opacity 1.5s ease; margin-top: 5px; }

        /* زر التحكم في الموسيقى */
        .music-control { position: absolute; top: 25px; left: 25px; background: rgba(255,64,129,0.15); border: 1px solid rgba(255,64,129,0.4); color: #ff80ab; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; gap: 6px; transition: 0.3s; z-index: 40; }
        .music-control:hover { background: rgba(255,64,129,0.3); }
    </style>
</head>
<body>

    <div class="stars-bg" id="starsBg"></div>

    <audio id="loveAudio" preload="auto" loop>
        <source src="https://g.top4top.io/m_3888ok87a1.mp3" type="audio/mp3">
    </audio>

    <button class="music-control" id="musicBtn" onclick="toggleAudio()" style="display: none;">
        🎵 <span id="musicStateText">إيقاف الموسيقى</span>
    </button>

    <!-- شاشة التحميل الأولى -->
    <div class="loading-screen" id="loadingScreen">
        <div class="spinner"></div>
        <div class="loading-text">ثواني ياروحي معلش 😂♥️</div>
    </div>

    <!-- شاشة الرمز -->
    <div class="auth-screen" id="authScreen">
        <div class="auth-box">
            <h2>جاهزة🤔 ❤️</h2>
            <p>فكري بقي في الباسورد 😂😂</p>
            
            <div class="code-dots">
                <div class="dot" id="dot-0"></div>
                <div class="dot" id="dot-1"></div>
                <div class="dot" id="dot-2"></div>
                <div class="dot" id="dot-3"></div>
            </div>

            <div class="keypad-grid">
                <button class="k-btn" onclick="pressNum('3')">3</button>
                <button class="k-btn" onclick="pressNum('2')">2</button>
                <button class="k-btn" onclick="pressNum('1')">1</button>
                <button class="k-btn" onclick="pressNum('6')">6</button>
                <button class="k-btn" onclick="pressNum('5')">5</button>
                <button class="k-btn" onclick="pressNum('4')">4</button>
                <button class="k-btn" onclick="pressNum('9')">9</button>
                <button class="k-btn" onclick="pressNum('8')">8</button>
                <button class="k-btn" onclick="pressNum('7')">7</button>
                <button class="k-btn" onclick="clearCode()">⌫</button>
                <button class="k-btn" onclick="pressNum('0')">0</button>
                <button class="k-btn" onclick="checkCode()">دخول</button>
            </div>
            <div class="auth-error" id="authError">❌ الرمز غير صحيح، جربي تاني!</div>
        </div>
    </div>

    <!-- شاشة العرض والرسائل سطر بسطر -->
    <div class="story-wrapper" id="storyWrapper">
        <div class="cinematic-card" id="cinematicCard">
            <div class="line-container" id="lineContainer"></div>

            <!-- نهاية الرسم التلقائي (القلب واسم Shrouk) -->
            <div class="drawing-reveal" id="drawingReveal">
                <svg class="heart-svg" viewBox="0 0 32 29.6">
                    <path id="heartPath" class="heart-path" d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,16,21.2,16,21.2s16-11.8,16-21.2C32,3.8,28.2,0,23.6,0z"/>
                </svg>

                <svg class="shrouk-svg" viewBox="0 0 300 90">
                    <text x="50%" y="65" dominant-baseline="middle" text-anchor="middle" id="shroukTextPath" class="shrouk-text-path">Shrouk</text>
                </svg>

                <div class="final-msg" id="finalMsg">انتي أكبر أمنياتي وكل دنيتي وعوض ربنا ليا ✨💍</div>
            </div>
        </div>
    </div>

    <script>
        const starsContainer = document.getElementById('starsBg');
        for (let i = 0; i < 60; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.width = (Math.random() * 3 + 1) + 'px';
            star.style.height = star.style.width;
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            starsContainer.appendChild(star);
        }

        // إخفاء شاشة التحميل بعد 2.5 ثانية والانتقال لشاشة الباسورد
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loadingScreen = document.getElementById('loadingScreen');
                const authScreen = document.getElementById('authScreen');
                
                loadingScreen.style.opacity = '0';
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                    authScreen.style.display = 'flex';
                    authScreen.style.opacity = '1';
                }, 800);
            }, 2500);
        });

        // الرمز السري الصحيح
        const correctPin = "2009"; 
        let enteredPin = "";

        function pressNum(n) {
            if (enteredPin.length < 4) {
                enteredPin += n;
                updateDots();
                
                if (enteredPin.length === 4) {
                    setTimeout(checkCode, 200);
                }
            }
        }

        function clearCode() {
            enteredPin = "";
            updateDots();
            document.getElementById('authError').style.display = 'none';
        }

        function updateDots() {
            for (let i = 0; i < 4; i++) {
                const dot = document.getElementById(`dot-${i}`);
                if (i < enteredPin.length) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            }
        }

        const lines = [
            "أنا بحبك عشان معرفتش معني الحب الا معاكي ❤️🌍💍",
            "بحبك عشان انتي اكتر حد فهمني في الدنيا دي",
            "انتي الوحيدة بكلمة منك بتفرحني",
            "مقدرش اتخيل حياتي من غيرك ومينفعش يعدي يوم من غير ما نتكلم",
            "أنا بدعي ربنا تكوني ليا لوحدي وبس ومن نصيبي بحبك يانور عيني",
            "عمري ما حبيت حد قد ما حبيتك وعمري ما تمنيت حد قد ما تمنيتك ❤️🥹",
            "ولو عشت عمر فوق عمري هشكر الزمن اني لقيتك",
            "حبيتك عشان ملقتش ونيس للعمر احسن منك بعشقك",
            "حاجتين ملهمش نهاية.. البحر وحبي ليكي 😊❤️",
            "وعهد الله انتي اجمل حاجة حصلت ف حياتي",
            "انتي عوض من ربنا ليا جيتي عوضتيني عن كل حاجة في حياتي 😘❤️",
            "ولو لفيت الدنيا دي مش هلاقي حد زيك في حنيتك وطيبة قلبك",
            "ربنا يخليكي ليا واعيش اللي باقي من عمري معاكي",
            "أيوة انتي اغلى حاجة في حياتي أنا مقدرش اعيش ثانية واحدة من غيرك ❤️❤️",
            "ايوة انتي اللي طلعت بيها من الدنيا كلها انتي اللي محليالي حياتي",
            "انا مهما الف الدنيا مش هلاقي في حنيتك ولا خوفك عليا 😂",
            "ربنا يخليكي ليا وما يحرمنيش منك ابدا ويديمك نعمه في حياتي",
            "يا اغلى ما املك في الكون كله بحبك وبموت فيكي 🤗",
            "انتي عمري وحياتي وونبض قلبي وحياتي من غيرك ولا اي حاجه 🫀❣️",
            "ونفسي عمري كله يكون جنبك وفي حضنك 🙈",
            "بحبك بحبك بحبك.. ودي كلمه قليله اووي بنسبه الي في قلبي ليكي 💘",
            "بس هتفضلي انتي الحاجه الوحيدة اللي انا بحلم بيها",
            "ونفسي اشوفها بالفستان الابيض جنبي 👰‍♀️✨"
        ];

        let currentLineIndex = 0;

        function checkCode() {
            const errorEl = document.getElementById('authError');
            const audio = document.getElementById('loveAudio');

            if (enteredPin === correctPin) { 
                audio.play().then(() => {
                    document.getElementById('musicBtn').style.display = 'flex';
                }).catch(e => console.log("Audio play blocked"));

                document.getElementById('authScreen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('authScreen').style.display = 'none';
                    document.getElementById('storyWrapper').style.display = 'flex';
                    playCinematicLines();
                }, 500);
            } else {
                errorEl.style.display = 'block';
                setTimeout(() => {
                    clearCode();
                }, 1200);
            }
        }

        function typeWriter(text, i, fnCallback) {
            if (i < text.length) {
                document.getElementById('lineContainer').innerHTML = text.substring(0, i+1) + '<span aria-hidden="true"></span>';
                setTimeout(function() {
                    typeWriter(text, i + 1, fnCallback);
                }, 45); 
            } else if (typeof fnCallback == 'function') {
                setTimeout(fnCallback, 3000); 
            }
        }

        function playCinematicLines() {
            if (currentLineIndex < lines.length) {
                typeWriter(lines[currentLineIndex], 0, function() {
                    currentLineIndex++;
                    playCinematicLines();
                });
            } else {
                document.getElementById('lineContainer').style.display = 'none';
                
                const drawingReveal = document.getElementById('drawingReveal');
                drawingReveal.style.display = 'flex';

                document.getElementById('heartPath').classList.add('animate');
                document.getElementById('shroukTextPath').classList.add('animate');

                setTimeout(() => {
                    document.getElementById('finalMsg').style.opacity = '1';
                }, 5000);
            }
        }

        function toggleAudio() {
            const audio = document.getElementById('loveAudio');
            const text = document.getElementById('musicStateText');
            if (audio.paused) {
                audio.play();
                text.innerText = "إيقاف الموسيقى";
            } else {
                audio.pause();
                text.innerText = "تشغيل الموسيقى";
            }
        }
    </script>
</body>
</html>

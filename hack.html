<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار الكاميرا الحية</title>
<style>
  body {
    background-color: #111;
    color: #fff;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
  }
  .camera-box {
    width: 100%;
    max-width: 400px;
    height: 300px;
    background: #000;
    border: 3px solid #ff0033;
    margin: 20px auto;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1); /* عشان تعكس الصورة زي المراية */
  }
  button {
    background: #ff0033;
    color: white;
    border: none;
    padding: 12px 25px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 5px;
    cursor: pointer;
  }
</style>
</head>
<body>

  <h2>تشغيل الكاميرا الأمامية حقيقي</h2>
  <p>اضغط على الزر أدناه للسماح للمتصفح بفتح الكاميرا:</p>

  <div class="camera-box">
    <video id="webcam" autoplay playsinline muted></video>
  </div>

  <button onclick="openCamera()">فتح الكاميرا الآن</button>

  <script>
    function openCamera() {
      // التأكد من دعم المتصفح للخاصية
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "user" }, 
          audio: false 
        })
        .then(stream => {
          const videoElement = document.getElementById('webcam');
          videoElement.srcObject = stream;
        })
        .catch(err => {
          alert("خطأ: تم رفض إذن الكاميرا أو أن المتصفح لا يدعم الاتصال الآمن HTTPS.");
          console.error(err);
        });
      } else {
        alert("متصفحك لا يدعم تشغيل الكاميرا مباشرة.");
      }
    }
  </script>

</body>
</html>
